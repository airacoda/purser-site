<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Purser Money, option 1: The Ledger. Kept-family indigo to violet, white ledger rows and a heavy total. -->
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f5bff"/>
      <stop offset="1" stop-color="#6d4fe6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#p1-bg)"/>
  <!-- three line items: description on the left, amount on the right -->
  <rect x="176" y="224" width="392" height="80" rx="40" fill="#ffffff"/>
  <rect x="672" y="224" width="176" height="80" rx="40" fill="#dfe2ff"/>
  <rect x="176" y="368" width="296" height="80" rx="40" fill="#ffffff"/>
  <rect x="640" y="368" width="208" height="80" rx="40" fill="#dfe2ff"/>
  <rect x="176" y="512" width="344" height="80" rx="40" fill="#ffffff"/>
  <rect x="704" y="512" width="144" height="80" rx="40" fill="#dfe2ff"/>
  <!-- the total: one heavy rule across the page, the way a book is ruled off -->
  <rect x="176" y="688" width="672" height="112" rx="56" fill="#ffffff"/>
</svg>
